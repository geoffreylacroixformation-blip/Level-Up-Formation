name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Debug environment variables
        run: |
          echo "SUPABASE_URL set: $([ -n "$PUBLIC_SUPABASE_URL" ] && echo 'yes' || echo 'no')"
          echo "SUPABASE_ANON_KEY set: $([ -n "$PUBLIC_SUPABASE_ANON_KEY" ] && echo 'yes' || echo 'no')"
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Build Astro site
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Inject Supabase credentials into static files
        run: |
          sed -i "s|import.meta.env.PUBLIC_SUPABASE_URL|'${{ secrets.SUPABASE_URL }}'|g" dist/assets/admin-login.js
          sed -i "s|import.meta.env.PUBLIC_SUPABASE_ANON_KEY|'${{ secrets.SUPABASE_ANON_KEY }}'|g" dist/assets/admin-login.js
          find dist -name "*.html" -exec sed -i "s|import.meta.env.PUBLIC_SUPABASE_URL|'${{ secrets.SUPABASE_URL }}'|g" {} +
          find dist -name "*.html" -exec sed -i "s|import.meta.env.PUBLIC_SUPABASE_ANON_KEY|'${{ secrets.SUPABASE_ANON_KEY }}'|g" {} +
          echo "Injected credentials into admin-login.js and all HTML files"
          grep -c "supabase.co" dist/assets/admin-login.js && echo "JS OK" || echo "JS FAIL"
          grep -c "supabase.co" dist/reset-password/index.html && echo "HTML OK" || echo "HTML FAIL"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
