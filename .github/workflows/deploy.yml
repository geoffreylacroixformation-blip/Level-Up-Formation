name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Debug environment variables
        run: |
          echo "SUPABASE_URL set: $([ -n "$PUBLIC_SUPABASE_URL" ] && echo 'yes' || echo 'no')"
          echo "SUPABASE_ANON_KEY set: $([ -n "$PUBLIC_SUPABASE_ANON_KEY" ] && echo 'yes' || echo 'no')"
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Build Astro site
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Inject Supabase credentials into static files
        run: |
          python3 -c "
          import os, re, glob
          url = os.environ.get('SUPABASE_URL', '')
          key = os.environ.get('SUPABASE_ANON_KEY', '')
          if not url or not key:
              print('ERROR: Supabase secrets are empty!')
              exit(1)
          replacements = [
              (url, 'import.meta.env.PUBLIC_SUPABASE_URL'),
              (key, 'import.meta.env.PUBLIC_SUPABASE_ANON_KEY'),
          ]
          files_to_fix = ['dist/assets/admin-login.js'] + glob.glob('dist/**/*.html', recursive=True)
          for fpath in files_to_fix:
              content = open(fpath, 'r').read()
              for value, placeholder in replacements:
                  content = content.replace(placeholder, repr(value)[1:-1])
              open(fpath, 'w').write(content)
              print(f'Injected into {fpath}')
          print('Done!')
          "
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
